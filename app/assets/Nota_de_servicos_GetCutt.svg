  <text id="field-service-name-2" x="64" y="564" font-size="11" font-weight="700">Barba completa</text>
  <text id="field-service-description-2" x="64" y="582" font-size="9" fill="#626262">Modelagem + finalizacao</text>
  <text id="field-service-qty-2" x="492" y="569" text-anchor="middle" font-size="10">1</text>
  <text id="field-service-unit-2" x="638" y="569" text-anchor="end" font-size="10">R$ 35,00</text>
  <text id="field-service-total-2" x="776" y="569" text-anchor="end" font-size="10" font-weight="700">R$ 35,00</text>
  <line x1="52" y1="600" x2="784" y2="600" stroke="#252525"/>
