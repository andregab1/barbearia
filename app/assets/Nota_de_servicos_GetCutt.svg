  <rect x="52" y="65" width="60" height="60" fill="#f4d000" stroke="#252525" stroke-width="1"/>
  <g stroke="#171717" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="69" cy="101" r="5"/><circle cx="94" cy="101" r="5"/><path d="M73 97 95 78M90 97 68 78"/>
  </g>
  <text x="126" y="93" font-size="25" font-weight="700">getcutt<tspan fill="#b88a00">.</tspan></text>
  <text x="126" y="113" font-size="8.5" fill="#626262">GESTAO DE SERVICOS</text>
  <text x="440" y="79" text-anchor="middle" font-size="14" font-weight="700">NOTA FISCAL DE SERVICO</text>
  <text x="440" y="100" text-anchor="middle" font-size="14" font-weight="700">ELETRONICA - NFS-e</text>
  <text x="440" y="121" text-anchor="middle" font-size="9" fill="#626262">Prestacao de servicos</text>
  <rect x="610" y="55" width="186" height="90" fill="#ffffff" stroke="#252525" stroke-width="1"/>
  <line x1="610" y1="84" x2="796" y2="84" stroke="#252525"/>
  <line x1="610" y1="113" x2="796" y2="113" stroke="#252525"/>
  <text x="620" y="70" font-size="7.5" fill="#626262">NUMERO DA NOTA</text>
  <text id="field-receipt-number" x="620" y="80" font-size="11" font-weight="700">Nº 000128</text>
  <text x="620" y="96" font-size="7.5" fill="#626262">DATA DE EMISSAO</text>
  <text id="field-issued-at" x="786" y="106" text-anchor="end" font-size="10" font-weight="700">28/09/2026 · 10:45</text>
  <text x="620" y="128" font-size="7.5" fill="#626262">CODIGO DE VERIFICACAO</text>
  <text id="field-verification" x="620" y="140" font-size="8" font-weight="700">NFS-GETCUTT-000128</text>
</g>

