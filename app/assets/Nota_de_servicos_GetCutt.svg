  <text x="52" y="1051" font-size="8" fill="#626262">Nota de servicos emitida pelo sistema GetCutt.</text>
  <text id="field-control-number" x="52" y="1084" font-size="8" fill="#626262">CONTROLE INTERNO · Nº 000128</text>
