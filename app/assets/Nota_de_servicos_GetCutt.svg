<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 840 1188" role="img" aria-labelledby="title desc">
<title id="title">GetCutt — Comprovante de serviços</title>
<desc id="desc">Modelo demonstrativo editável em formato A4. Dados fictícios. Documento sem valor fiscal. Três serviços, subtotal de 100 reais, desconto de 10 reais e total pago de 90 reais.</desc>
