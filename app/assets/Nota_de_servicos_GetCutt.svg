  <text id="field-service-description-3" x="64" y="636" font-size="9" fill="#626262">Acabamento com navalha</text>
  <text id="field-service-qty-3" x="492" y="623" text-anchor="middle" font-size="10">1</text>
  <text id="field-service-unit-3" x="638" y="623" text-anchor="end" font-size="10">R$ 15,00</text>
  <text id="field-service-total-3" x="776" y="623" text-anchor="end" font-size="10" font-weight="700">R$ 15,00</text>
