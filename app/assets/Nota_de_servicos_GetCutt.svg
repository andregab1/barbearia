  <text id="field-payment-status" x="52" y="925" font-size="9" fill="#626262">Pagamento: Pago</text>
  <text id="field-payment-method" x="258" y="925" font-size="9" fill="#626262">Pix · R$ 90,00</text>
  <text id="field-payment-date" x="500" y="925" font-size="9" fill="#626262">Recebido em 28/09/2026 às 10:43</text>
  <text id="field-balance" x="52" y="950" font-size="9" fill="#626262">Saldo pendente: R$ 0,00</text>
  <text x="52" y="974" font-size="7" fill="#626262">Documento gerado pelo GetCutt. A validade fiscal depende da autorizacao do municipio ou provedor integrado.</text>
</g>

