<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 840 1188" role="img" aria-labelledby="title desc">
<title id="title">GetCutt - Nota Fiscal de Servico Eletronica</title>
<desc id="desc">Modelo visual de nota fiscal de servicos em formato A4, com campos de prestador, tomador, servicos e valores.</desc>
<rect width="840" height="1188" fill="#ffffff"/>
<rect x="24" y="24" width="792" height="1140" fill="#ffffff" stroke="#252525" stroke-width="1.4"/>

<!-- Cabecalho NFS-e -->
<g id="cabecalho" font-family="Inter" fill="#171717">
